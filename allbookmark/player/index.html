<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>모두의 북마크 플레이어</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!--
  모두의 북마크 앱(폰)과 크롬 확장이 영상을 앱 안에서 보여 줄 때 여는 페이지다.
  유튜브 공식 퍼가기 플레이어(IFrame Player API)를 띄우고, 재생 상태와 보는 자리(초)를 앱에 알린다.
  유튜브는 퍼가기 플레이어를 띄운 사이트 주소가 없으면 재생하지 않기도 해서, 앱이 이 주소로 연다.
  폰은 웹뷰로, 크롬 확장은 이 페이지를 iframe 으로 띄우고 postMessage 로 주고받는다.
  보던 자리는 앱이 기기에 남긴다. 이 페이지는 아무것도 저장하거나 서버로 보내지 않는다.
-->
<div id="player"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var videoId = params.get('v') || '';
  var loop = params.get('loop') === '1';
  var start = Math.max(0, Math.floor(Number(params.get('start')) || 0));
  var player = null;
  var PLAYING = 1;
  var PROGRESS_MS = 5000;
  // 크롬 확장 화면 안에 띄웠을 때만 부모와 주고받는다.
  var EXTENSION_ORIGIN = /^chrome-extension:\/\/[a-p]{32}$/;
  var parentOrigin = null;
  if (window.parent !== window) {
    var ref = '';
    try {
      ref = (location.ancestorOrigins && location.ancestorOrigins[0]) || new URL(document.referrer).origin;
    } catch (e) {
      ref = '';
    }
    if (EXTENSION_ORIGIN.test(ref)) parentOrigin = ref;
  }

  function send(message) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
    if (parentOrigin) window.parent.postMessage({ allbookmark: message }, parentOrigin);
  }

  // 보는 자리. 어느 영상의 자리인지 함께 보내, 다음 영상으로 바뀌는 사이에 온 값이 섞이지 않게 한다.
  function where() {
    if (!player || !player.getCurrentTime || !player.getVideoData) return {};
    var data = player.getVideoData() || {};
    return { v: data.video_id || '', t: player.getCurrentTime() || 0, d: player.getDuration() || 0 };
  }

  setInterval(function () {
    if (player && player.getPlayerState && player.getPlayerState() === PLAYING) {
      var w = where();
      w.type = 'progress';
      send(w);
    }
  }, PROGRESS_MS);

  function validId(id) {
    return /^[A-Za-z0-9_-]{11}$/.test(id);
  }

  if (!validId(videoId)) {
    send({ type: 'error', code: 2 });
    return;
  }

  function playerVars(id) {
    var vars = { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin };
    if (start > 0) vars.start = start;
    if (loop) {
      vars.loop = 1;
      vars.playlist = id;
    }
    return vars;
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: videoId,
      width: '100%',
      height: '100%',
      playerVars: playerVars(videoId),
      events: {
        onReady: function (e) {
          send({ type: 'ready' });
          e.target.playVideo();
        },
        onStateChange: function (e) {
          var w = where();
          w.type = 'state';
          w.state = e.data;
          send(w);
        },
        onError: function (e) {
          send({ type: 'error', code: e.data });
        }
      }
    });
  };

  // 앱이 다음 영상으로 바꾸거나(보던 자리부터), 처음부터 다시 틀거나, 앱을 내릴 때 멈춘다.
  window.allbookmark = {
    load: function (id, from) {
      if (!player || !player.loadVideoById || !validId(id)) return;
      if (loop) {
        player.loadPlaylist({ playlist: [id], index: 0 });
        player.setLoop(true);
      } else {
        player.loadVideoById({ videoId: id, startSeconds: Math.max(0, Math.floor(Number(from) || 0)) });
      }
    },
    seek: function (seconds) {
      if (player && player.seekTo) player.seekTo(Math.max(0, Number(seconds) || 0), true);
    },
    pause: function () {
      if (player && player.pauseVideo) player.pauseVideo();
    }
  };

  window.addEventListener('message', function (e) {
    if (!parentOrigin || e.origin !== parentOrigin || e.source !== window.parent) return;
    var c = e.data && e.data.allbookmark;
    if (!c || typeof c.cmd !== 'string') return;
    if (c.cmd === 'load') window.allbookmark.load(String(c.id || ''), c.from);
    else if (c.cmd === 'seek') window.allbookmark.seek(c.seconds);
    else if (c.cmd === 'pause') window.allbookmark.pause();
  });

  document.addEventListener('fullscreenchange', function () {
    send({ type: 'fullscreen', on: !!document.fullscreenElement });
  });
  document.addEventListener('webkitfullscreenchange', function () {
    send({ type: 'fullscreen', on: !!document.webkitFullscreenElement });
  });

  var api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  api.onerror = function () {
    send({ type: 'error', code: -1 });
  };
  document.head.appendChild(api);
})();
</script>
</body>
</html>
