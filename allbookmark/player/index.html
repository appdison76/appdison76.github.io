<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>모두의 북마크 플레이어</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!--
  모두의 북마크 앱이 피드 영상을 앱 안에서 보여 줄 때 여는 페이지다.
  유튜브 공식 퍼가기 플레이어(IFrame Player API)를 띄우고, 재생 상태를 앱에 알린다.
  유튜브는 퍼가기 플레이어를 띄운 사이트 주소가 없으면 재생하지 않기도 해서, 앱이 이 주소로 연다.
  아무것도 저장하거나 보내지 않는다.
-->
<div id="player"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var videoId = params.get('v') || '';
  var loop = params.get('loop') === '1';
  var player = null;

  function send(message) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
  }

  function validId(id) {
    return /^[A-Za-z0-9_-]{11}$/.test(id);
  }

  if (!validId(videoId)) {
    send({ type: 'error', code: 2 });
    return;
  }

  function playerVars(id) {
    var vars = { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin };
    if (loop) {
      vars.loop = 1;
      vars.playlist = id;
    }
    return vars;
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: videoId,
      width: '100%',
      height: '100%',
      playerVars: playerVars(videoId),
      events: {
        onReady: function (e) {
          send({ type: 'ready' });
          e.target.playVideo();
        },
        onStateChange: function (e) {
          send({ type: 'state', state: e.data });
        },
        onError: function (e) {
          send({ type: 'error', code: e.data });
        }
      }
    });
  };

  // 앱이 다음 영상으로 바꾸거나, 앱을 내릴 때 멈춘다.
  window.allbookmark = {
    load: function (id) {
      if (!player || !player.loadVideoById || !validId(id)) return;
      if (loop) {
        player.loadPlaylist({ playlist: [id], index: 0 });
        player.setLoop(true);
      } else {
        player.loadVideoById(id);
      }
    },
    pause: function () {
      if (player && player.pauseVideo) player.pauseVideo();
    }
  };

  document.addEventListener('fullscreenchange', function () {
    send({ type: 'fullscreen', on: !!document.fullscreenElement });
  });
  document.addEventListener('webkitfullscreenchange', function () {
    send({ type: 'fullscreen', on: !!document.webkitFullscreenElement });
  });

  var api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  api.onerror = function () {
    send({ type: 'error', code: -1 });
  };
  document.head.appendChild(api);
})();
</script>
</body>
</html>
